function $(sel, parent = document) { return parent.querySelector(sel); }
function toast(msg, type = 'info') {
  const container = $('#toast-container');
  const el = document.createElement('div');
  el.className = `toast px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium ${type === 'success' ? 'bg-teal-600' : type === 'error' ? 'bg-red-600' : 'bg-gray-800'}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function formatCurrency(n) { return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(n); }
function formatDate(d) { return new Date(d).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' }); }

function loginAs(role) {
  state.user = { ...DEMO_USERS[role] };
  if (role === 'parent') state.activeChild = DEMO_USERS.student;
  toast(`Welcome, ${state.user.name}`, 'success');
  navigate('dashboard');
}
function logout() { state.user = null; state.activeChild = null; navigate('landing'); toast('You have been logged out'); }
function navigate(view) { state.currentView = view; render(); window.scrollTo(0, 0); }

function render() {
  const app = $('#app');
  if (!state.user) {
    if (state.currentView === 'about') app.innerHTML = renderAbout();
    else if (state.currentView === 'contact') app.innerHTML = renderContact();

  } else {
    app.innerHTML = renderShell();

}

function renderAchievements() {
  return `<div><h1 class="text-xl font-bold mb-4">Achievements & Badges</h1><div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${BADGES.map(b => `<div class="bg-white rounded-xl border p-4 text-center ${b.earned?'':'opacity-40'}"><div class="text-3xl mb-2">${b.icon}</div><div class="text-sm font-medium">${b.name}</div><div class="text-[10px] mt-1 ${b.earned?'text-green-600':'text-gray-400'}">${b.earned?'Earned':'Locked'}</div></div>`).join('')}</div></div>`;
}

function renderFees() {
  const f = SAMPLE_FEES; const total = f.items.reduce((s,i) => s + i.amount, 0);
  return `<div><h1 class="text-xl font-bold mb-4">Fees & Payments</h1><div class="bg-white rounded-xl border p-4 mb-4"><div class="text-sm text-gray-500 mb-2">${f.term} • ${f.session}</div><div class="space-y-2">${f.items.map(i => `<div class="flex justify-between text-sm"><span>${i.name}</span><span class="font-medium">${formatCurrency(i.amount)}</span></div>`).join('')}<div class="border-t pt-2 flex justify-between font-bold"><span>Total</span><span>${formatCurrency(total)}</span></div></div></div>
    <div class="grid grid-cols-2 gap-3 mb-4"><div class="stat-card p-3 text-center"><div class="text-lg font-bold text-green-600">${formatCurrency(f.paid)}</div><div class="text-xs">Paid</div></div><div class="stat-card p-3 text-center"><div class="text-lg font-bold text-amber-600">${formatCurrency(f.outstanding)}</div><div class="text-xs">Outstanding</div></div></div>
    <p class="text-xs text-gray-400 mb-3">Due date: ${formatDate(f.dueDate)}</p>
    <button onclick="toast('Payment gateway (Paystack/Flutterwave) ready for integration')" class="w-full py-3 bg-school-teal text-white rounded-xl font-semibold">Pay Outstanding Balance</button>
    <button class="w-full mt-2 py-2 text-sm text-school-teal font-medium">Download Receipts</button></div>`;
}

function renderAttendance() {
  return `<div><h1 class="text-xl font-bold mb-4">Attendance</h1><div class="bg-white rounded-xl border p-4 mb-4 text-center"><div class="text-3xl font-bold text-school-teal">96%</div><div class="text-sm text-gray-500">Overall this term</div></div>
    <div class="bg-white rounded-xl border overflow-hidden"><div class="px-4 py-2 bg-gray-50 text-xs font-semibold text-gray-500">Recent records (demo)</div>
    ${['Mon 12 Jan – Present','Tue 13 Jan – Present','Wed 14 Jan – Present','Thu 15 Jan – Absent (Sick)','Fri 16 Jan – Present'].map(r => `<div class="px-4 py-2.5 text-sm border-t flex justify-between"><span>${r.split(' – ')[0]}</span><span class="${r.includes('Absent')?'text-red-600':'text-green-600'} font-medium">${r.split(' – ')[1]}</span></div>`).join('')}</div></div>`;
}

function renderMessages() {
  return `<div><h1 class="text-xl font-bold mb-4">Parent–Teacher Messages</h1><p class="text-sm text-gray-500 mb-4">Secure in-app messaging. Phone numbers are never exposed.</p>
    <div class="bg-white rounded-xl border p-4 space-y-3"><div class="border rounded-lg p-3"><div class="text-xs text-gray-400">Mr. Olumide Akinwale (Mathematics)</div><div class="text-sm mt-1">Please encourage Ibrahim to complete the additional practice questions.</div><div class="text-[10px] text-gray-400 mt-2">2 days ago</div></div>
    <div class="border rounded-lg p-3 bg-teal-50/50"><div class="text-xs text-gray-400">You</div><div class="text-sm mt-1">Thank you. We will ensure he practices this weekend.</div></div></div>
    <div class="mt-4 flex gap-2"><input type="text" placeholder="Type a message..." class="flex-1 border rounded-lg px-3 py-2 text-sm" /><button class="bg-school-teal text-white px-4 rounded-lg text-sm" onclick="toast('Message sent (demo)')">Send</button></div></div>`;
}

function renderCalendar() {
  return `<div><h1 class="text-xl font-bold mb-4">School Calendar</h1><div class="space-y-2">${CALENDAR.map(e => `<div class="bg-white rounded-xl border p-3 flex gap-3 items-center"><div class="w-12 text-center shrink-0"><div class="text-xs text-gray-400">${new Date(e.date).toLocaleString('en',{month:'short'})}</div><div class="text-lg font-bold text-school-teal">${new Date(e.date).getDate()}</div></div><div><div class="font-medium text-sm">${e.title}</div><div class="text-xs text-gray-400 capitalize">${e.type}</div></div></div>`).join('')}</div></div>`;
}

document.addEventListener('DOMContentLoaded', () => { render(); });
</script>
</body>
</html>
